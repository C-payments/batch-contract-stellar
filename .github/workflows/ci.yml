name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  STELLAR_CLI_VERSION: 28.1.0

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned Rust toolchain
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal \
            --target wasm32v1-none --component llvm-tools

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Tests and coverage (at least 90% of lines)
        run: |
          cargo llvm-cov --ignore-filename-regex 'test\.rs' \
            --fail-under-lines 90 --summary-only | tee coverage.txt
          { echo '### Coverage'; echo '```'; cat coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Install stellar-cli
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" stellar
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build contract
        run: stellar contract build

      - name: Wasm hash
        run: |
          sha256sum target/wasm32v1-none/release/multisend.wasm | tee multisend.wasm.sha256
          { echo '### Wasm sha256'; echo '```'; cat multisend.wasm.sha256; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: multisend-wasm
          path: |
            target/wasm32v1-none/release/multisend.wasm
            multisend.wasm.sha256
